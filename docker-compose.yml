version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fleetpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleetpulse-net

  # 2. FleetPulse Go Backend API & WebSocket Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fleetpulse?sslmode=disable
      ENVIRONMENT: production
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - fleetpulse-net

  # 3. FleetPulse React Frontend & Map Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws/alerts
    container_name: fleetpulse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
      - "5173:80"
    networks:
      - fleetpulse-net

volumes:
  postgres_data:
    driver: local

networks:
  fleetpulse-net:
    driver: bridge

